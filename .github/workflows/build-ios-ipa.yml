name: Build unsigned iOS .ipa (for SideStore / AltStore / Sideloadly)

# Put this file at .github/workflows/build-ios-ipa.yml in YOUR FORK of openGym.
# Run it from the Actions tab -> "Build unsigned iOS .ipa" -> Run workflow.
# The unsigned .ipa is attached to the run as an artifact. SideStore re-signs
# it with your own Apple ID when you install it, so no certificates are needed.

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Xcode scheme (leave as App unless the log says otherwise)"
        default: "App"
        required: false
      ref:
        description: "Branch, tag or commit to build (default: the branch you run from)"
        required: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show toolchain
        run: |
          xcodebuild -version
          node --version
          pod --version || true
          ls -la frontend/ios frontend/ios/App 2>/dev/null || true

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci || npm install

      # VITE_MOBILE build + `cap sync` into ios/ (this also runs `pod install`
      # on macOS when the iOS project uses CocoaPods).
      - name: Build mobile bundle
        working-directory: frontend
        run: npm run build:mobile

      - name: Install CocoaPods dependencies (if the project uses them)
        run: |
          if [ -f frontend/ios/App/Podfile ] && [ ! -d frontend/ios/App/Pods ]; then
            cd frontend/ios/App && pod install
          fi

      - name: Archive without code signing
        id: archive
        working-directory: frontend/ios/App
        env:
          SCHEME: ${{ inputs.scheme || 'App' }}
        run: |
          set -eo pipefail

          if [ -d App.xcworkspace ]; then
            TARGET=(-workspace App.xcworkspace)
          else
            TARGET=(-project App.xcodeproj)
          fi

          echo "::group::xcodebuild -list"
          xcodebuild -list "${TARGET[@]}" || true
          echo "::endgroup::"

          xcodebuild archive \
            "${TARGET[@]}" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/openGym.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$RUNNER_TEMP/xcodebuild.log" | tail -n 200

      - name: Package .ipa
        id: package
        run: |
          set -eo pipefail

          APP_PATH=$(find "$RUNNER_TEMP/openGym.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in the archive" >&2
            find "$RUNNER_TEMP/openGym.xcarchive" -maxdepth 4 >&2
            exit 1
          fi
          echo "App bundle: $APP_PATH"

          VERSION=$(node -p "require('./frontend/package.json').version" 2>/dev/null || echo "dev")
          IPA_NAME="openGym-${VERSION}-unsigned.ipa"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/$IPA_NAME" Payload)

          shasum -a 256 "$IPA_NAME" | tee "$IPA_NAME.sha256"
          ls -lh "$IPA_NAME"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: openGym-unsigned-ipa
          path: |
            ${{ steps.package.outputs.ipa_name }}
            ${{ steps.package.outputs.ipa_name }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
